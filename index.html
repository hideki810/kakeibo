<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家計簿</title>
<meta name="theme-color" content="#1B6A55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家計簿">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EE; --surface:#FFFFFF; --ink:#17232B; --sub:#5B6A72; --line:#D5DCD8;
  --accent:#1B6A55; --on-accent:#FFFFFF; --income:#1F5A96;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10181C; --surface:#18242A; --ink:#E7EEEA; --sub:#93A3AA; --line:#2A3A41;
    --accent:#4FC29D; --on-accent:#06231A; --income:#7DB4F0;
  }
}
:root[data-theme="dark"]{
  --bg:#10181C; --surface:#18242A; --ink:#E7EEEA; --sub:#93A3AA; --line:#2A3A41;
  --accent:#4FC29D; --on-accent:#06231A; --income:#7DB4F0;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',Meiryo,sans-serif;
  -webkit-tap-highlight-color:transparent;
  font-variant-numeric:tabular-nums;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
#main{flex:1;padding:14px 16px 96px}
.note{font-size:12px;color:var(--sub);margin:0 0 8px}

/* 下部ナビ */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav button{height:56px;background:none;border:0;color:var(--sub);font-size:14px;font-weight:500}
nav button.on{color:var(--accent);font-weight:700;box-shadow:inset 0 3px 0 var(--accent)}

/* 入力 */
.month-line{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 10px;font-size:13px;color:var(--sub)}
.month-line b{font-size:15px;color:var(--ink);font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{height:38px;border:0;border-radius:9px;background:transparent;color:var(--sub);font-weight:500;font-size:15px}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:700}
.amount{display:flex;justify-content:flex-end;align-items:baseline;gap:6px;padding:12px 4px 8px;border-bottom:2px solid var(--line);margin-bottom:12px}
.amount .yen{font-size:22px;color:var(--sub);font-weight:500}
.amount .num{font-size:46px;font-weight:700;line-height:1.1;letter-spacing:-0.01em}
.amount .num.empty{color:var(--sub);opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.meta{display:flex;gap:8px;margin-bottom:12px}
.meta input{min-width:0;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:15px;padding:0 12px}
.meta #memo{flex:1}
.meta #date{width:150px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.pad button{height:clamp(46px,7.2dvh,58px);border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:22px;font-weight:500}
.pad button:active{background:var(--line)}
.rec{width:100%;height:54px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:17px;font-weight:700}
.rec:disabled{opacity:.35;cursor:default}

/* 月ナビ */
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mnav h2{margin:0;font-size:18px;font-weight:700}
.mnav button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:18px}
.mnav button:disabled{opacity:.3;cursor:default}

/* 履歴 */
.day{margin-bottom:14px}
.day-h{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);padding:0 4px 5px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:12px 14px;border-bottom:1px solid var(--line)}
.list > :last-child{border-bottom:0}
.row .l{min-width:0}
.row .c{font-weight:700;font-size:15px}
.row .m{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{font-weight:700;font-size:16px;white-space:nowrap}
.row .a.inc{color:var(--income)}
.acts{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.acts button{flex:1;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}
.acts .del{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* まとめ */
.tot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.tot .box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tot .box.wide{grid-column:1 / -1}
.tot .k{font-size:13px;color:var(--sub)}
.tot .v{font-size:24px;font-weight:700;margin-top:2px}
.tot .v.inc{color:var(--income)}
.sec-t{margin:0 0 8px;font-size:15px;font-weight:700}
.bar{margin-bottom:12px}
.bar-top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.bar-top .r{color:var(--sub)}
.track{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:999px}
.inc-list{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin-bottom:16px}
.inc-list div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.inc-list div:last-child{border-bottom:0}
.empty-s{padding:36px 8px;text-align:center;color:var(--sub);font-size:14px;line-height:1.7}

/* トースト */
#toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:none;align-items:center;gap:14px;font-size:14px;max-width:calc(100% - 32px);z-index:10}
#toast.show{display:flex}
#toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <main id="main"></main>
  <nav><div class="in" id="nav">
    <button data-tab="input">入力</button>
    <button data-tab="history">履歴</button>
    <button data-tab="summary">月まとめ</button>
  </div></nav>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<script>
(function(){
  var KEY = 'kakeibo:v1';
  var CATS = {
    expense: ['食費','外食','日用品','交通費','通信費','光熱費','住居','医療','趣味・娯楽','その他'],
    income:  ['給与','副業','その他']
  };
  var WD = ['日','月','火','水','木','金','土'];

  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function todayStr(){ var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  function fmt(n){ return Number(n).toLocaleString('ja-JP'); }
  function yen(n){ return '¥' + fmt(n); }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function monthLabel(m){ var p = m.split('-'); return p[0] + '年' + Number(p[1]) + '月'; }
  function shiftMonth(m, d){ var p = m.split('-'); var dt = new Date(Number(p[0]), Number(p[1]) - 1 + d, 1); return dt.getFullYear() + '-' + pad(dt.getMonth()+1); }

  var storageOk = true;
  function load(){
    try {
      var r = localStorage.getItem(KEY);
      return r ? JSON.parse(r) : [];
    } catch (e) { storageOk = false; return []; }
  }
  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(S.entries)); storageOk = true; }
    catch (e) { storageOk = false; }
  }

  var S = {
    entries: load(),
    tab: 'input',
    type: 'expense',
    cat: '食費',
    amount: '',
    memo: '',
    date: todayStr(),
    month: todayStr().slice(0, 7),
    sel: null
  };
  var toastTimer = null, lastId = null;

  function curMonth(){ return todayStr().slice(0, 7); }
  function inMonth(m){ return S.entries.filter(function(e){ return e.date.slice(0, 7) === m; }); }
  function sum(list, type){ return list.filter(function(e){ return e.type === type; }).reduce(function(a, e){ return a + e.amount; }, 0); }

  function mnavHtml(){
    return '<div class="mnav">' +
      '<button data-act="prev" aria-label="前の月">‹</button>' +
      '<h2>' + monthLabel(S.month) + '</h2>' +
      '<button data-act="next" aria-label="次の月"' + (S.month >= curMonth() ? ' disabled' : '') + '>›</button>' +
    '</div>';
  }

  function viewInput(){
    var cm = curMonth();
    var exp = sum(inMonth(cm), 'expense');
    var amtNum = S.amount === '' ? '0' : fmt(parseInt(S.amount, 10));
    var chips = CATS[S.type].map(function(c){
      return '<button class="chip' + (c === S.cat ? ' on' : '') + '" data-cat="' + esc(c) + '">' + esc(c) + '</button>';
    }).join('');
    var keys = ['7','8','9','4','5','6','1','2','3','00','0','del'].map(function(k){
      return '<button data-k="' + k + '"' + (k === 'del' ? ' aria-label="1文字消す"' : '') + '>' + (k === 'del' ? '⌫' : k) + '</button>';
    }).join('');
    return (storageOk ? '' : '<p class="note">この環境ではデータを保存できません。ページを閉じると記録は消えます。</p>') +
      '<div class="month-line"><span>' + Number(cm.split('-')[1]) + '月の支出</span><b>' + yen(exp) + '</b></div>' +
      '<div class="seg">' +
        '<button data-type="expense" class="' + (S.type === 'expense' ? 'on' : '') + '">支出</button>' +
        '<button data-type="income" class="' + (S.type === 'income' ? 'on' : '') + '">収入</button>' +
      '</div>' +
      '<div class="amount" aria-live="polite"><span class="yen">¥</span><span class="num' + (S.amount === '' ? ' empty' : '') + '">' + amtNum + '</span></div>' +
      '<div class="chips">' + chips + '</div>' +
      '<div class="meta"><input id="memo" type="text" maxlength="40" placeholder="メモ（任意）" value="' + esc(S.memo) + '"><input id="date" type="date" value="' + S.date + '"></div>' +
      '<div class="pad">' + keys + '</div>' +
      '<button class="rec" data-act="rec"' + (S.amount === '' ? ' disabled' : '') + '>' + (S.type === 'expense' ? '支出' : '収入') + 'を記録</button>';
  }

  function viewHistory(){
    var list = inMonth(S.month).slice().reverse();
    list.sort(function(a, b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    var html = mnavHtml();
    if (!list.length){
      return html + '<div class="empty-s">この月の記録はまだありません。<br>「入力」タブから追加できます。</div>';
    }
    var groups = [], map = {};
    list.forEach(function(e){
      if (!map[e.date]){ map[e.date] = { date: e.date, items: [] }; groups.push(map[e.date]); }
      map[e.date].items.push(e);
    });
    groups.forEach(function(g){
      var p = g.date.split('-');
      var wd = WD[new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])).getDay()];
      var dayExp = sum(g.items, 'expense');
      html += '<div class="day"><div class="day-h"><span>' + Number(p[1]) + '月' + Number(p[2]) + '日（' + wd + '）</span><span>' + (dayExp ? '支出 ' + yen(dayExp) : '') + '</span></div><div class="list">';
      g.items.forEach(function(e){
        html += '<button class="row" data-sel="' + e.id + '"><span class="l"><span class="c">' + esc(e.cat) + '</span>' +
          (e.memo ? '<div class="m">' + esc(e.memo) + '</div>' : '') + '</span>' +
          '<span class="a' + (e.type === 'income' ? ' inc' : '') + '">' + (e.type === 'income' ? '+' : '') + yen(e.amount) + '</span></button>';
        if (S.sel === e.id){
          html += '<div class="acts"><button class="del" data-del="' + e.id + '">この記録を削除</button><button data-act="close">やめる</button></div>';
        }
      });
      html += '</div></div>';
    });
    return html;
  }

  function viewSummary(){
    var list = inMonth(S.month);
    var html = mnavHtml();
    if (!list.length){
      return html + '<div class="empty-s">この月の記録はまだありません。<br>「入力」タブから追加できます。</div>';
    }
    var exp = sum(list, 'expense'), inc = sum(list, 'income'), bal = inc - exp;
    html += '<div class="tot">' +
      '<div class="box"><div class="k">支出</div><div class="v">' + yen(exp) + '</div></div>' +
      '<div class="box"><div class="k">収入</div><div class="v inc">' + yen(inc) + '</div></div>' +
      '<div class="box wide"><div class="k">収支</div><div class="v' + (bal >= 0 ? ' inc' : '') + '">' + (bal >= 0 ? '+' : '−') + yen(Math.abs(bal)) + '</div></div>' +
    '</div>';
    if (exp > 0){
      var by = {};
      list.forEach(function(e){ if (e.type === 'expense') by[e.cat] = (by[e.cat] || 0) + e.amount; });
      var rows = Object.keys(by).map(function(k){ return { c: k, v: by[k] }; }).sort(function(a, b){ return b.v - a.v; });
      html += '<h3 class="sec-t">支出の内訳</h3>';
      rows.forEach(function(r){
        var pct = Math.round(r.v / exp * 100);
        html += '<div class="bar"><div class="bar-top"><span>' + esc(r.c) + '</span><span class="r">' + yen(r.v) + '　' + pct + '%</span></div><div class="track"><i style="width:' + pct + '%"></i></div></div>';
      });
    }
    if (inc > 0){
      var bi = {};
      list.forEach(function(e){ if (e.type === 'income') bi[e.cat] = (bi[e.cat] || 0) + e.amount; });
      html += '<h3 class="sec-t" style="margin-top:8px">収入の内訳</h3><div class="inc-list">' +
        Object.keys(bi).map(function(k){ return '<div><span>' + esc(k) + '</span><span>' + yen(bi[k]) + '</span></div>'; }).join('') + '</div>';
    }
    return html;
  }

  function render(){
    var main = document.getElementById('main');
    main.innerHTML = S.tab === 'input' ? viewInput() : S.tab === 'history' ? viewHistory() : viewSummary();
    var btns = document.querySelectorAll('#nav button');
    for (var i = 0; i < btns.length; i++){
      btns[i].className = btns[i].getAttribute('data-tab') === S.tab ? 'on' : '';
    }
  }

  function showToast(html){
    var t = document.getElementById('toast');
    t.innerHTML = html;
    t.className = 'show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.className = ''; }, 4500);
  }

  function record(){
    var amt = parseInt(S.amount, 10) || 0;
    if (!amt) return;
    var e = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      date: S.date || todayStr(),
      type: S.type,
      cat: S.cat,
      amount: amt,
      memo: S.memo.trim()
    };
    S.entries.push(e);
    save();
    lastId = e.id;
    S.amount = '';
    S.memo = '';
    render();
    showToast('<span>記録しました　' + esc(e.cat) + ' ' + yen(e.amount) + '</span><button data-act="undo">取り消す</button>');
  }

  document.addEventListener('click', function(ev){
    var el = ev.target.closest('button');
    if (!el) return;
    var d = el.dataset;

    if (d.tab){ S.tab = d.tab; S.sel = null; if (d.tab !== 'input') S.month = S.month || curMonth(); render(); return; }
    if (d.type){ S.type = d.type; S.cat = CATS[d.type][0]; render(); return; }
    if (d.cat){ S.cat = d.cat; render(); return; }
    if (d.k){
      var k = d.k;
      if (k === 'del'){ S.amount = S.amount.slice(0, -1); }
      else {
        if (S.amount === '' && (k === '0' || k === '00')) return;
        if ((S.amount + k).length > 9) return;
        S.amount += k;
      }
      render(); return;
    }
    if (d.sel){ S.sel = (S.sel === d.sel) ? null : d.sel; render(); return; }
    if (d.del){
      S.entries = S.entries.filter(function(e){ return e.id !== d.del; });
      S.sel = null; save(); render(); return;
    }
    if (d.act === 'close'){ S.sel = null; render(); return; }
    if (d.act === 'prev'){ S.month = shiftMonth(S.month, -1); S.sel = null; render(); return; }
    if (d.act === 'next'){ if (S.month < curMonth()){ S.month = shiftMonth(S.month, 1); S.sel = null; render(); } return; }
    if (d.act === 'rec'){ record(); return; }
    if (d.act === 'undo'){
      if (lastId){
        S.entries = S.entries.filter(function(e){ return e.id !== lastId; });
        lastId = null; save(); render();
      }
      document.getElementById('toast').className = '';
      return;
    }
  });

  document.addEventListener('input', function(ev){
    if (ev.target && ev.target.id === 'memo') S.memo = ev.target.value;
  });
  document.addEventListener('change', function(ev){
    if (ev.target && ev.target.id === 'date'){
      if (ev.target.value) S.date = ev.target.value;
      render();
    }
  });
  document.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter' && ev.target && ev.target.id === 'memo') ev.target.blur();
  });

  render();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
  });
}
</script>
</body>
</html>
